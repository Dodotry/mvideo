# =========================================================================
# 1. 基础运行、端口绑定与 Web UI 插件
# =========================================================================
# 统一 IPv4 与 IPv6 端口
#bind :6053
bind [::]:6053

# 数据目录与 Web 界面配置
data-dir /opt/smartdns/data
plugin smartdns_ui.so
smartdns-ui.www-root /usr/share/smartdns/wwwroot
smartdns-ui.ip http://0.0.0.0:6080
smartdns-ui.max-query-log-age 86400
smartdns-ui.enable-terminal yes
smartdns-ui.user admin
smartdns-ui.password admin

# =========================================================================
# 2. 规则文件引入与分组定义
# =========================================================================
# 明确两个核心组：china(国内) 和 oversea(海外)
# 国内外域名分流组
conf-file /opt/smartdns/cn.conf -group cn
conf-file /opt/smartdns/oversea.conf -group oversea

# 新增：引入本地映射与广告屏蔽自定义文件（不需要加 -group，全局生效）
conf-file /opt/smartdns/local-hosts.conf
conf-file /opt/smartdns/ad-block.conf

# =========================================================================
# 3. 性能优化与双栈微调
# =========================================================================
cache-size 32768
prefetch-domain yes
serve-expired yes
rr-ttl-min 10

# 屏蔽不成熟的 HTTPS (Type 65) 记录
force-qtype-SOA 65

# 智能双栈优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes

# 日志安全规范（保留 3 份防止撑爆）
log-level warn
log-file /var/log/smartdns/smartdns.log
log-size 16m
log-num 3

# =========================================================================
# 1. 上游服务器定义 (定义 cn 组、oversea 组和默认组)
# =========================================================================

# --- 【国内加速组：同时作为默认组 (不加exclude标签)】 ---
# 这样可以确保当域名不在任何列表里时，默认走国内盲测，不会断网，也不会被海外DNS减速
server 119.29.29.29 -group cn
server 118.143.39.139 -group cn
server 114.114.114.114 -group cn
server-quic 223.5.5.5 -group cn
server-h3 h3://223.5.5.5/dns-query -group cn
#server-https https://doh.pub/dns-query -group cn
server-https https://doh.pub/dns-query -group cn -host-name doh.pub -http-host doh.pub

server [2400:3200::1] -group cn
server [2400:3200:baba::1] -group cn

# --- 【海外防污染组】 ---
# 去掉 -exclude-default-group，改用 domain-rules 强行指派。
# 注意：国内直连 8.8.8.8 等UDP53端口极易被拦截，建议后面配合特殊网络环境转发
server 8.8.8.8 -group oversea
server 8.8.4.4 -group oversea
server 1.1.1.1 -group oversea
server 1.0.0.1 -group oversea
server 9.9.9.9 -group oversea
server 168.126.63.1 -group oversea
server 168.126.63.2 -group oversea
server 208.67.222.222 -group oversea
server [2001:4860:4860::8888] -group oversea
server [2001:4860:4860::8844] -group oversea
server-https https://doh.opendns.com/dns-query -group oversea
server-https https://cloudflare-dns.com/dns-query -group oversea
server-quic quic://dns.adguard-dns.com -group oversea
server-quic dns.alidns.com -group oversea -host-name dns.alidns.com



# =========================================================================
# 2. 域名集合定义与分流规则
# =========================================================================
domain-set -name china-domains -file /opt/smartdns/cn.conf
domain-set -name oversea-domains -file /opt/smartdns/oversea.conf

# 严格匹配列表分流：命中的域名各自走对应组解析
domain-rules /domain-set:china-domains/ -nameserver cn
domain-rules /domain-set:oversea-domains/ -nameserver oversea


# =========================================================================
# 3. 解决 DoH/DoQ 域名解析死循环 (引导 DNS 配置)
# =========================================================================
# 必须使用常规 UDP DNS 来专门解析 DoH 服务器的域名，打破“先有鸡还是先有蛋”的死循环
domain-rules /://alidns.com -nameserver cn
domain-rules /doh.pub/ -nameserver cn
domain-rules /opendns.com/ -nameserver cn
domain-rules /cloudflare-dns.com/ -nameserver cn
domain-rules /://adguard-dns.com -nameserver cn


# Cloudflare DoH (使用 -host-name 传递证书域名用于 TLS 握手，-http-host 用于 HTTP 报文)
#server-https https://1.1.1.1 -host-name cloudflare-dns.com -http-host cloudflare-dns.com -group oversea

# OpenDNS DoH
#server-https https://208.67.222.222 -host-name ://opendns.com -http-host ://opendns.com -group oversea

# AdGuard DoH (使用其官方公共 Anycast IP)
#server-https https://94.140.14.14 -host-name ://adguard-dns.com -http-host ://adguard-dns.com -group oversea

# AdGuard QUIC (DoQ 服务，使用 -host-name 传递证书域名)
# server-quic 94.140.14.14:853 -host-name ://adguard-dns.com -group oversea
