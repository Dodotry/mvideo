# =========================================================================
# 1. 基础运行、端口绑定与 Web UI 插件
# =========================================================================
# 统一 IPv4 与 IPv6 端口
#bind :6053
bind [::]:6053

# 数据目录与 Web 界面配置
data-dir /opt/smartdns/data
plugin smartdns_ui.so
smartdns-ui.www-root /usr/share/smartdns/wwwroot
smartdns-ui.ip http://0.0.0.0:6080
smartdns-ui.max-query-log-age 86400
smartdns-ui.enable-terminal yes
smartdns-ui.user admin
smartdns-ui.password admin

# =========================================================================
# 2. 规则文件引入与分组定义
# =========================================================================
# 明确两个核心组：china(国内) 和 oversea(海外)
# 国内外域名分流组
conf-file /opt/smartdns/cn.conf -group cn
conf-file /opt/smartdns/oversea.conf -group oversea

# 新增：引入本地映射与广告屏蔽自定义文件（不需要加 -group，全局生效）
conf-file /opt/smartdns/local-hosts.conf
conf-file /opt/smartdns/ad-block.conf

# =========================================================================
# 3. 性能优化与双栈微调
# =========================================================================
cache-size 32768
prefetch-domain yes
serve-expired yes
rr-ttl-min 10

# 屏蔽不成熟的 HTTPS (Type 65) 记录
force-qtype-SOA 65

# 智能双栈优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes

# 日志安全规范（保留 3 份防止撑爆）
log-level info
log-file /var/log/smartdns/smartdns.log
log-size 16m
log-num 3

# =========================================================================
# 4. 上游服务器配置 (理顺组名：china / oversea / 默认组)
# =========================================================================

# --- 【默认组：用于无规则命中时的快速盲测】 ---
server 119.29.29.29
server 118.143.39.139
server-quic 223.5.5.5
server-h3 h3://223.5.5.5/dns-query

# --- 【China 组：国内专属加速，杜绝隐私泄露】 ---
server 119.29.29.29 -group cn -exclude-default-group
server 118.143.39.139 -group cn -exclude-default-group
server 114.114.114.114 -group cn -exclude-default-group
server-https https://doh.pub/dns-query -group cn -exclude-default-group
server [2400:3200::1] -group cn -exclude-default-group
server [2400:3200:baba::1] -group cn -exclude-default-group

# --- 【Oversea 组：海外专属防污染，全面升级安全连接】 ---
# IPv4 节点
server 8.8.8.8 -group oversea -exclude-default-group
server 8.8.4.4 -group oversea -exclude-default-group
server 1.1.1.1 -group oversea -exclude-default-group
server 1.0.0.1 -group oversea -exclude-default-group
server 9.9.9.9 -group oversea -exclude-default-group
server 208.67.222.222 -group oversea -exclude-default-group
# IPv6 节点
server [2001:4860:4860::8888] -group oversea -exclude-default-group
server [2001:4860:4860::8844] -group oversea -exclude-default-group
# 加密安全节点 (DoH / DoQ)
server-https https://doh.opendns.com/dns-query -group oversea -exclude-default-group
server-https https://cloudflare-dns.com/dns-query -group oversea -exclude-default-group
server-quic quic://dns.adguard-dns.com -group oversea -exclude-default-group

# =========================================================================
# 5. 分流路由核心转换（彻底解决死循环及未定义组报错）
# =========================================================================
# 让 cn.conf 和 oversea.conf 真正强制生效
# 1. 将域名列表文件转换为 SmartDNS 可识别的集合
domain-set -name china-domains -file /opt/smartdns/cn.conf
domain-set -name oversea-domains -file /opt/smartdns/oversea.conf

# 2. 将集合内的域名强制指派给对应的服务器组解析
domain-rules /domain-set:china-domains/ -nameserver cn
domain-rules /domain-set:oversea-domains/ -nameserver oversea
# 3. 解决公共 DNS 自身的域名解析死循环：强制让默认国内组去解析这些安全 DNS 的 IP
nameserver /://alidns.com
nameserver /doh.pub/
nameserver /://opendns.com
nameserver /://cloudflare-dns.com
nameserver /://adguard-dns.com


